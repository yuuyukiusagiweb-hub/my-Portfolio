  <link rel="icon" href="../Portfolio/images/top-illustration-color2.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="./JavaScript/script.js" defer></script>
</head>

<body>

  <div class="split-wrapper">
    <div class="fixed-side">
      <div class="main-visual">
        <img src="./images/top-illustration-color2.gif" alt="メインイラスト" class="main-visual">
      </div>
    </div>
      
    <main class="scroll-content">
      <header class="header">
        <div class="header-inner">
          <div class="header-logo">
            <a href="index.html">Yurie Watanabe</a>
          </div>
          
          <div class="nav-toggle" id="nav-toggle">
            <span></span>
            <span></span>
          </div>
          
          <nav class="nav">
            <ul>
              <li><a href="index.html">HOME</a></li>
              <li><a href="work.html">WORK</a></li>
              <li><a href="about.html">ABOUT</a></li>
              <li><a href="contact.html">CONTACT</a></li>
            </ul>
          </nav>
        </div>
      </header>
      
      <main class="contact-container about-layout-center">
        <div class="page-header">
          <h2 class="title-en">CONTACT</h2>
          <div class="deco-line"></div>
        </div>
          
       <form id="contact-form" action="https://formspree.io/f/mzdjnwgb" method="POST" novalidate>
        <div class="form-group">
          <label for="name">お名前 <span class="label-required">*必須</span></label>
          <input type="text" id="name" name="name" placeholder="例：田中 太郎" required>
        </div>
        
        <div class="form-group">
          <label for="kana">ふりがな <span class="label-required">*必須</span></label>
          <input type="text" id="kana" name="kana" placeholder="例：たなか たろう" required>
        </div>
        
        <div class="form-group">
          <label for="email">メールアドレス <span class="label-required">*必須</span></label>
          <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>
            
        <div class="form-group">
          <label for="company">会社名 <span class="label-optional">任意</span></label>
          <input type="text" id="company" name="company" placeholder="例：株式会社サンプル">
        </div>
        
        <div class="form-group">
          <label for="message">お問い合わせ内容 <span class="label-required">*必須</span></label>
          <textarea id="message" name="message" rows="6" placeholder="お問い合わせ内容をご記入ください" required></textarea>
        </div>
        
        <div class="privacy-policy">
          <p>個人情報の取り扱いについては、<a href="privacy.html" class="policy-link" target="_blank">プライバシーポリシー</a>をご確認ください。</p>
        </div>
        
        <div class="submit-area">
          <button type="submit" id="submit-btn" class="submit-btn" disabled>送信する</button>
        </div>
       </form>

      </main>
    

      <nav class="detail-nav">
        <a href="index.html" class="next-link">
          <span class="next-label">Back</span>
          <img src="./images/next-arrow.png" alt="" class="next-arrow-img">
          <span class="next-title">HOME</span>
        </a>
      </nav>


    <footer class="footer">
      <small>&copy; Yurie Watanabe Portfolio</small>
    </footer>
  </div>

</body>
</html>
